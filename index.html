{id:'health',title:['Healthcare service information','معلومات الخدمات الصحية','स्वास्थ्य सेवाएँ','স্বাস্থ্য সেবা','Services de santé'],icon:'🩺',portal:'MOHAP',url:'https://mohap.gov.ae',scope:'All',role:'all',keys:'health hospital clinic doctor medical صحة مستشفى طبيب स्वास्थ्य डॉक्टर স্বাস্থ্য হাসপাতাল santé médecin hôpital',docs:'Service requirements depend on provider, location and insurance. Use the official catalog to identify the correct service.'},

const languageIndex=()=>['en','ar','hi','bn','fr'].indexOf(s.lang);
const title=c=>c.title[languageIndex()];
function rank(q=''){const tokens=q.toLowerCase().split(/\s+/).filter(Boolean);return catalogs.map(c=>({c,score:tokens.reduce((n,w)=>n+((c.keys+' '+c.title.join(' ')).toLowerCase().includes(w)?4:0),0)+(c.scope===s.emirate?2:0)+(c.role===s.role?1:0)})).filter(x=>!tokens.length||tokens.some(w=>(x.c.keys+' '+x.c.title.join(' ')).toLowerCase().includes(w))).sort((a,b)=>b.score-a.score).map(x=>x.c)}
function serviceCard(c){return `<article class="card service"><span style="font-size:25px">${c.icon}</span><h3>${esc(title(c))}</h3><span class="badge">${esc(c.portal)} · ${esc(c.scope==='All'?'Federal / national information':c.scope)}</span><p class="small muted">Demo relevance: ${esc(c.scope===s.emirate?s.emirate+' match':c.role===s.role?'Profile match':'General information')}. Eligibility must be checked with the provider.</p><button data-action="service" data-id="${c.id}">View steps →</button></article>`}
function openModal(content){const d=$('#modal');d.innerHTML=`<button class="close" data-action="close" aria-label="Close dialog">✕</button>${content}`;d.showModal()}
function render(){document.documentElement.lang=s.lang;document.documentElement.dir=s.lang==='ar'?'rtl':'ltr';if(s.step<5){onboard();return}$('#app').innerHTML=`<header><div class="wrap"><div class="row between"><div class="row"><div class="logo" aria-hidden="true">s.</div><div><div class="brand">Sila OS</div><small>Service navigation · Interactive demo</small></div></div><div class="row toolbar"><select id="language" aria-label="Language">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${s.lang===k?'selected':''}>${v}</option>`).join('')}</select><button data-action="notifications" aria-label="${t('notifications')}">♧</button><button data-action="profile">${t('profile')}</button></div></div><div class="row portals">${link('https://www.tamm.abudhabi','TAMM')}${link('https://moi.gov.ae','MOI')}${link('https://icp.gov.ae','Emirates ID · ICP')}${s.role==='visitor'?link('https://uaepass.ae','UAE PASS · registration information'):''}</div></div></header><main class="wrap stack" id="content"></main><nav class="nav" aria-label="Main navigation"><div>${[['home','⌂'],['explore','⌕'],['health','♡'],['ai','✧'],['map','⌖']].map(([id,icon])=>`<button data-action="tab" data-id="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${t(id)}</button>`).join('')}</div></nav>`;renderContent()}
function onboard(){const welcome=`<div class="logo">s.</div><h1>Welcome to Sila OS ☁</h1><p class="muted">A calmer way to discover government services and your UAE community.</p><div class="notice">Prototype only. No government account or live AI is connected. OTP is simulated.</div><button class="primary" data-action="next" style="width:100%;margin-top:20px">Get started →</button>`;
let body=welcome;if(s.step===1)body=`<h1>Let's say hello.</h1><p class="muted">Enter an email or phone number for demo onboarding.</p><form id="contactForm">${input('contact','Email or phone',s.contact,'text',true)}<p class="small muted">Nothing is sent. Enter any four digits on the next screen.</p><button class="primary">Continue</button></form>`;
if(s.step===2)body=`<h1>Your demo code</h1><p class="muted">Any four digits work. No SMS or email has been sent.</p><form id="otpForm"><div class="otp">${[0,1,2,3].map(i=>`<input aria-label="Code digit ${i+1}" id="digit${i}" class="digit" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off">`).join('')}</div><button class="primary" style="margin-top:20px;width:100%">Verify demo code</button></form>`;
if(s.step===3)body=`<h1>Make it yours.</h1><p class="muted">Select your profile. This does not verify residency.</p><button class="role" data-action="role" data-id="resident"><span>🏛️</span><span><strong>UAE Resident</strong><br><small>Citizen or resident service discovery</small></span></button><button class="role" data-action="role" data-id="visitor"><span>🌴</span><span><strong>Visitor / Tourist</strong><br><small>Visit, explore and access information</small></span></button>`;
if(s.step===4)body=`<h1>Where are you based?</h1><p class="muted">Choose one emirate to personalize suggestions.</p><form id="emirateForm"><label for="emirate">Your emirate</label><select id="emirate" required><option value="">Select an emirate</option>${emirates.map(e=>`<option ${s.emirate===e?'selected':''}>${e}</option>`).join('')}</select><label for="onlang">Language</label><select id="onlang">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${s.lang===k?'selected':''}>${v}</option>`).join('')}</select><button class="primary" style="margin-top:20px">Open my dashboard →</button></form>`;
$('#app').innerHTML=`<div class="screen"><section class="card onboard stack">${s.step?'<button data-action="back">← Back</button>':''}${body}<div class="small muted">Step ${s.step+1} of 5 · No real authentication</div></section></div>`}
function renderContent(){const out=$('#content');if(!out)return;if(tab==='home')out.innerHTML=`<section class="card hero"><span class="badge">${esc(s.role==='resident'?'UAE Resident':'Visitor / Tourist')} · ${esc(s.emirate)}</span><h1>${t('hello')}${s.displayName?', '+esc(s.displayName):''} ☁</h1><p>${t('welcome')}</p><form id="serviceSearch" class="row" style="margin-top:20px"><input name="q" id="serviceQuery" placeholder="${t('search')}: ID, visa, driving, student…" aria-label="${t('search')}" value="${esc(query)}" style="flex:1;min-width:180px"><button class="primary">${t('search')}</button></form></section><section class="grid">${[['ai','✧',t('assistant')],['explore','⌕',t('explore')],['health','♡',t('health')],['map','⌖',t('map')]].map(([id,icon,label])=>`<button class="card" data-action="tab" data-id="${id}">${icon} ${label} →</button>`).join('')}</section><section><div class="row between"><h2>${query?t('search'):t('recommended')}</h2>${query?'<button data-action="clearSearch">Clear</button>':''}</div><div class="grid">${rank(query).slice(0,query?8:4).map(serviceCard).join('')||`<div class="card empty">${t('noresults')}</div>`}</div><p class="small muted">Recommendations use a small hand-curated demo catalog, emirate and profile. Not an official integrated government catalog.</p></section><section class="card"><h2>Youth & Civic Hub</h2><div class="grid">${[['Volunteering','Discover opportunities and check each opportunity’s age rules.','https://volunteers.ae'],['Youth programmes','Find workshops, programmes and participation requirements.','https://youth.gov.ae'],['Education resources','Explore official education information.','https://www.moe.gov.ae']].map(([a,b,c])=>`<article><h3>${a}</h3><p class="small muted">${b}</p>${link(c,'Official portal')}</article>`).join('')}</div></section><section class="card"><h2>Challenge impact</h2><p>Targets: 60% less service-discovery time and 45% higher service adoption.</p><p class="small muted">These are challenge goals, not measured results. Validate through timed user tests and official handoff/completion tracking. This prototype does not track completed government transactions.</p></section><footer>No affiliation with government agencies. Verify requirements, eligibility and fees on official portals. Some supporting UI labels remain English; navigation, service titles and demo assistant messages support all five languages.</footer>`;
if(tab==='explore')explore();if(tab==='health')health();if(tab==='ai')ai();if(tab==='map')map()}
const samples=[{id:'demo1',name:'Cloud Nine Peer Tutors',category:'Tutoring',price:'Demo: AED 50 / hour',description:'Example maths and science peer tutoring listing.',emirate:'Dubai'},{id:'demo2',name:'Little Blue Repair Club',category:'Repair',price:'Demo: free assessment',description:'Sample youth initiative for small electronics repairs.',emirate:'Sharjah'},{id:'demo3',name:'Neighbourhood Meal Club',category:'Food',price:'Demo: AED 20 / meal',description:'Sample community meal service; not a verified provider.',emirate:'Abu Dhabi'}];let directoryQ='',directoryCat='All';
function explore(){let listings=[...s.businesses,...samples].filter(b=>(directoryCat==='All'||b.category===directoryCat)&&(b.name+' '+b.description+' '+b.emirate).toLowerCase().includes(directoryQ.toLowerCase()));$('#content').innerHTML=`<div class="row between"><div><h1>Local businesses & tutors</h1><p class="muted">Discover community skills. All seeded listings are examples.</p></div><button class="primary" data-action="addBusiness">＋ List a service</button></div><form id="directoryForm" class="row card"><input id="directoryQ" aria-label="Search listings" value="${esc(directoryQ)}" placeholder="Search by name, service or emirate" style="flex:1"><select id="directoryCat" aria-label="Category" style="width:160px">${['All','Tutoring','Repair','Food','Community','Other'].map(c=>`<option ${directoryCat===c?'selected':''}>${c}</option>`).join('')}</select><button>Search</button></form><div id="listingGrid" class="grid">${listings.map(b=>`<article class="card"><span class="badge">${b.id.startsWith('demo')?'Demo listing':'Your local listing · not verified'}</span><h3>${esc(b.name)}</h3><small>${esc(b.category)} · ${esc(b.emirate)}</small><p>${esc(b.description)}</p><p class="small">${esc(b.price||'Rate not provided')}</p><button data-action="business" data-id="${esc(b.id)}">View details →</button></article>`).join('')||'<div class="card empty">No listings found. Try another search or add your own.</div>'}</div><p class="notice">Listings you submit are saved in this browser only. They are not publicly published or shared with other users.</p>`}
function businessForm(){const d=s.businessDraft;openModal(`<h2>List your service</h2><p class="small muted">Draft saves on this device as you type. Do not enter someone else’s contact details.</p><form id="businessForm">${input('name','Listing title',d.name,'text',true)}<label for="category">Category</label><select name="category" id="category">${['Tutoring','Repair','Food','Community','Other'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select>${input('price','Price / rate',d.price)}${input('businessEmirate','Emirate',d.businessEmirate||s.emirate)}${input('phone','Phone (optional)',d.phone,'tel')}${input('email','Email (optional)',d.email,'email')}${input('website','Website (optional, https://…)',d.website,'url')}<label for="description">Description</label><textarea id="description" name="description" required>${esc(d.description)}</textarea><button class="primary" style="margin-top:18px">Save listing locally</button></form>`)}
function health(){const h=s.health;$('#content').innerHTML=`<h1>${t('health')} & emergency information</h1><div class="notice">Not a medical record system. Do not store sensitive health information on a shared device. Saving health details is optional; storage is unencrypted browser storage.</div><section class="card"><h2>Emergency pass</h2><form id="healthForm"><div class="grid">${input('blood','Blood type',h.blood)}${input('allergies','Allergies',h.allergies)}${input('emergencyName','Emergency contact name',h.emergencyName)}${input('emergencyPhone','Emergency contact phone',h.emergencyPhone,'tel')}</div><label for="conditions">Conditions / important information</label><textarea id="conditions" name="conditions">${esc(h.conditions)}</textarea><label><input type="checkbox" id="consent" ${s.consent?'checked':''} style="width:auto"> Allow storing these details on this device</label><div class="row"><button class="primary">Save emergency information</button><button type="button" data-action="exportHealth">Download pass (.txt)</button><button type="button" data-action="clearHealth">Delete health data</button></div></form><p class="small muted">Without storage consent, changes stay in this open tab only.</p></section><section class="card"><h2>Symptom information</h2><form id="symptomForm"><div class="grid">${input('age','Age (optional)',s.symptoms.age,'number')}${input('duration','Duration',s.symptoms.duration)}</div><label for="symptomText">Symptoms</label><textarea id="symptomText" required>${esc(s.symptoms.text)}</textarea><button class="primary" style="margin-top:12px">View safety information</button></form><div id="wellnessResult" role="status"></div></section><section class="card"><h2>Food scanner interface</h2><p class="muted">Working local upload preview. Recognition and nutrition estimates are not connected.</p><div class="row"><label class="btn" for="foodUpload">Upload photo</label><input id="foodUpload" type="file" accept="image/*" class="hidden"><label class="btn" for="foodCamera">Take a photo</label><input id="foodCamera" type="file" accept="image/*" capture="environment" class="hidden"></div><div id="foodPreview">${photoURL?`<img src="${photoURL}" class="preview" alt="Your uploaded food photo"><p>${t('scan')}</p>`:''}</div><p class="small muted">Camera support depends on the browser/device. Images stay in this tab and are not uploaded.</p></section>`}
function ai(){const messages=chat.length?chat:[{role:'assistant',text:t('intro'),lang:s.lang}];$('#content').innerHTML=`<h1>${t('assistant')}</h1><div class="notice">${t('demo')}</div><section class="card"><div id="messages" class="chat" role="log" aria-live="polite">${messages.map(m=>`<div class="message ${m.role==='user'?'user':''}" lang="${m.lang||'en'}">${esc(m.text)}${(m.ids||[]).map(id=>{const c=catalogs.find(x=>x.id===id);return `<button data-action="service" data-id="${id}" style="margin-top:10px">${esc(title(c))} →</button>`}).join('')}</div>`).join('')}${busy?`<div class="muted" role="status">${t('loading')}</div>`:''}</div><form id="chatForm" class="row"><input id="chatInput" aria-label="Your question" placeholder="${t('search')}…" required style="flex:1" ${busy?'disabled':''}><button class="primary" ${busy?'disabled':''}>${t('send')}</button></form></section><div class="row">${catalogs.slice(0,4).map(c=>`<button data-action="prompt" data-id="${c.id}" ${busy?'disabled':''}>${esc(title(c))}</button>`).join('')}<button data-action="clearChat">Clear conversation</button></div><p class="small muted">Conversation is kept for this open tab only. The assistant uses keyword matching, not generative AI; it cannot answer arbitrary questions. Existing messages remain in the language used when sent.</p>`;$('#messages').scrollTop=$('#messages').scrollHeight}
function sendChat(q,forced){if(busy||!q.trim())return;chat.push({role:'user',text:q.trim(),lang:s.lang});busy=true;ai();setTimeout(()=>{let matches=forced?[catalogs.find(c=>c.id===forced)]:rank(q).slice(0,3);chat.push({role:'assistant',text:matches.length?t('found'):t('missing'),ids:matches.map(c=>c.id),lang:s.lang});busy=false;if(tab==='ai')ai()},650)}
const places=[['Public libraries','📚','Dubai',24,26],['Restrooms','🚻','Abu Dhabi',16,66],['Food supplies','🥫','Sharjah',39,23],['Blood drives','🩸','Ras Al Khaimah',66,14],['E-waste / Enviroserve','♻️','Dubai',31,47],['Student resources','🎓','Ajman',48,32],['Public libraries','📚','Umm Al Quwain',57,21],['Restrooms','🚻','Fujairah',78,55]];
function map(){let list=places.filter(p=>mapCategory==='All'||p[0]===mapCategory);$('#content').innerHTML=`<h1>Eco & Civic Action Map</h1><div class="notice">Illustrative map, not geographic coordinates. Pins are sample categories only. Links search Google Maps for current places; they do not claim an exact verified facility or active blood drive.</div><div class="row">${['All',...new Set(places.map(p=>p[0]))].map(c=>`<button class="filter ${mapCategory===c?'active':''}" data-action="mapFilter" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="map" aria-label="Illustrative community map"><svg viewBox="0 0 800 320" aria-hidden="true"><path d="M70 250 Q160 130 310 160 T650 35 L750 100 650 280 300 300Z" fill="#bfdbfe" stroke="#91b8ef" stroke-width="2"/><path d="M110 260 Q330 120 650 70" stroke="white" stroke-width="8" fill="none"/></svg>${list.map(p=>`<button class="pin" style="left:${p[3]}%;top:${p[4]}%" data-action="place" data-id="${places.indexOf(p)}" aria-label="${esc(p[0]+' in '+p[2])}">${p[1]}</button>`).join('')}<span class="map-caption">Illustration · All 7 emirates represented</span></div><div class="grid">${list.map(p=>`<article class="card"><span>${p[1]}</span><h3>${esc(p[0])}</h3><p class="muted">${esc(p[2])} · sample search</p>${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]+' '+p[2]+' UAE'),'Search Google Maps')}</article>`).join('')}</div>`}
function download(name,content){const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showService(id){const c=catalogs.find(x=>x.id===id);openModal(`<span class="badge">Demo guidance · ${esc(c.portal)}</span><h2>${c.icon} ${esc(title(c))}</h2><p>${t('found')}</p><h3>Suggested steps</h3><ol><li>Open the official portal below.</li><li>Find the specific service and review its current requirements.</li><li>Use the portal’s official sign-in flow if required.</li><li>Confirm eligibility, fees, documents and submission steps there.</li></ol><p class="notice">${esc(c.docs)}</p><p class="small muted">No eligibility decision, fee quote or completion estimate is provided by Sila OS. This guidance is in English; the official portal may offer language options.</p>${link(c.url,c.portal)}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close'){$('#modal').close();return}if(a==='next'){s.step++;persist();render()}if(a==='back'){s.step=Math.max(0,s.step-1);persist();render()}if(a==='role'){s.role=id;s.step=4;persist();render()}if(a==='tab'){tab=id;render();window.scrollTo(0,0)}if(a==='service')showService(id);if(a==='clearSearch'){query='';renderContent()}if(a==='notifications')openModal(`<h2>${t('notifications')}</h2><div class="notice">No government account is connected. There are no live notifications or renewal reminders.</div><p>Your profile: ${esc(s.emirate)} · ${esc(s.role)}</p>`);
if(a==='profile')openModal(`<h2>${t('profile')}</h2><form id="profileForm">${input('displayName','Preferred name',s.displayName)}<label for="profileRole">Profile type</label><select id="profileRole"><option value="resident" ${s.role==='resident'?'selected':''}>UAE Resident</option><option value="visitor" ${s.role==='visitor'?'selected':''}>Visitor / Tourist</option></select><label for="profileEmirate">Emirate</label><select id="profileEmirate">${emirates.map(x=>`<option ${s.emirate===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" style="margin-top:16px">Save profile</button></form><hr><button data-action="reset">Delete local data & restart</button>`);
if(a==='reset'&&confirm('Delete all Sila OS data stored in this browser?')){localStorage.removeItem(KEY);location.reload()}if(a==='addBusiness')businessForm();if(a==='business'){const b=[...samples,...s.businesses].find(x=>x.id===id);openModal(`<h2>${esc(b.name)}</h2><span class="badge">${esc(b.category)} · ${esc(b.emirate)}</span><p>${esc(b.description)}</p><p>${esc(b.price)}</p><p>Contact: ${esc(b.email||'Not supplied')}<br>${esc(b.phone||'Not supplied')}</p>${b.id.startsWith('demo')?'<div class="notice">Sample listing. No real business or contact is represented.</div>':`${b.email?link('mailto:'+b.email,'Email'):''} ${b.phone?link('https://wa.me/'+b.phone.replace(/\D/g,''),'WhatsApp'):''} ${b.website?link(b.website,'Website'):''}`}<p class="small muted">Unverified local listing. Check any provider independently.</p>`)}
if(a==='exportHealth'){const h=Object.fromEntries(new FormData($('#healthForm')));download('sila-emergency-pass.txt','SILA OS · SELF-REPORTED EMERGENCY INFORMATION\nNot a verified medical document\n\n'+Object.entries(h).map(([k,v])=>k+': '+v).join('\n'));toast('Emergency pass downloaded. Keep it private.')}
if(a==='clearHealth'&&confirm('Delete locally saved health information?')){s.health={};s.consent=false;persist();health();toast('Health information deleted.')}
if(a==='prompt')sendChat(title(catalogs.find(c=>c.id===id)),id);if(a==='clearChat'){if(busy)return;chat=[];ai()}if(a==='mapFilter'){mapCategory=id;map()}if(a==='place'){const p=places[Number(id)];openModal(`<h2>${p[1]} ${esc(p[0])}</h2><p>${esc(p[2])}</p><p class="notice">Sample marker, not a verified facility. Search current results and confirm opening hours, availability and access.</p>${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]+' '+p[2]+' UAE'),'Search Google Maps')}`)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='contactForm'){const v=$('#contact').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)&&!/^\+?[\d\s()-]{8,20}$/.test(v)){toast('Enter a valid email or phone number.');return}s.contact=v;s.step=2;persist();render();$('#digit0').focus()}if(f.id==='otpForm'){if(![0,1,2,3].every(i=>/^\d$/.test($('#digit'+i).value))){toast('Enter four digits.');return}s.step=3;persist();render()}if(f.id==='emirateForm'){s.emirate=$('#emirate').value;s.lang=$('#onlang').value;s.step=5;persist();render()}if(f.id==='serviceSearch'){query=$('#serviceQuery').value.trim();renderContent()}if(f.id==='directoryForm'){directoryQ=$('#directoryQ').value;directoryCat=$('#directoryCat').value;explore()}if(f.id==='businessForm'){const d=Object.fromEntries(new FormData(f));if(!d.name.trim()||!d.description.trim()){toast('Title and description cannot be blank.');return}if(d.website&&!/^https?:\/\//i.test(d.website)){toast('Website must start with https:// or http://');return}s.businesses.unshift({...d,id:'user'+Date.now(),emirate:d.businessEmirate});s.businessDraft={};persist();$('#modal').close();explore();toast('Saved on this device, not published publicly.')}if(f.id==='profileForm'){s.displayName=$('#displayName').value;s.role=$('#profileRole').value;s.emirate=$('#profileEmirate').value;persist();$('#modal').close();render();toast(t('saved'))}if(f.id==='healthForm'){s.consent=$('#consent').checked;s.health=Object.fromEntries(new FormData(f));persist();toast(s.consent?t('saved'):'Kept in this tab only. Storage consent is off.')}if(f.id==='symptomForm'){s.symptoms={age:$('#age').value,duration:$('#duration').value,text:$('#symptomText').value};$('#wellnessResult').innerHTML=`<div class="notice" style="margin-top:16px">${t('general')}<p><small>Informational purposes only, not medical advice. No AI diagnosis is generated.</small></p>${link('https://mohap.gov.ae','Official health information')}</div>`}if(f.id==='chatForm')sendChat($('#chatInput').value)});
// Only consented health data is serialized; drafts otherwise stay in memory.
const originalPersist=persist;persist=function(){const h=s.health,sy=s.symptoms;try{const clean={...s,health:s.consent?h:{},symptoms:{}};localStorage.setItem(KEY,JSON.stringify(clean));return true}catch(e){toast('Browser storage unavailable. Changes remain in this tab.');return false}};
document.addEventListener('input',e=>{if(e.target.classList.contains('digit')){e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);if(e.target.value){const next=e.target.nextElementSibling;if(next)next.focus()}}if(e.target.id==='contact')s.contact=e.target.value;if(e.target.closest('#businessForm')){s.businessDraft=Object.fromEntries(new FormData($('#businessForm')));persist()}if(e.target.closest('#healthForm')){s.health=Object.fromEntries(new FormData($('#healthForm')));if(s.consent)persist()}if(e.target.closest('#symptomForm'))s.symptoms={age:$('#age').value,duration:$('#duration').value,text:$('#symptomText').value}});
document.addEventListener('keydown',e=>{if(e.target.classList.contains('digit')&&e.key==='Backspace'&&!e.target.value)e.target.previousElementSibling?.focus()});
document.addEventListener('paste',e=>{if(!e.target.classList.contains('digit'))return;const digits=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,4);if(digits.length){e.preventDefault();digits.split('').forEach((x,i)=>$('#digit'+i).value=x);$('#digit'+Math.min(digits.length-1,3)).focus()}});
document.addEventListener('change',e=>{if(e.target.id==='language'){s.lang=e.target.value;persist();render()}if(e.target.id==='directoryCat'){directoryCat=e.target.value;directoryQ=$('#directoryQ').value;explore()}if(e.target.id==='consent'){s.consent=e.target.checked;s.health=Object.fromEntries(new FormData($('#healthForm')));persist()}if(['foodUpload','foodCamera'].includes(e.target.id)){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>10*1024*1024){toast('Choose an image smaller than 10 MB.');return}if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);$('#foodPreview').innerHTML=`<p><img class="preview" src="${photoURL}" alt="Uploaded meal photo"></p><p class="notice">${t('scan')}</p>`}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});render();
</script></body></html>
